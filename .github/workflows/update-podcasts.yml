name: Scheduled Podcast Analysis

on:
  schedule:
    - cron: '0 18 * * *'  # Every day at 08:00 UTC
  workflow_dispatch:     # Allows manual triggering too

jobs:
  update-podcasts:
    name: run scheduled analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run data update script
        run: |
          echo $(WS_ENDPOINT_URL)
          uv run llm_podcast_explorer/scheduled_runs.py --output_path ./static --s3_bucket llm-podcast-explorer
        env:
          PYTHONPATH: llm_podcast_explorer
          TEST_ENV: "test sucess"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
